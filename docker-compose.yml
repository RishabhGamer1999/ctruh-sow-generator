version: '3.8'

services:

  # ─── Local LLM Server ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sop-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── Local Vector Database ────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: sop-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ─── SOP Generator App ────────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: sop-app
    ports:
      - "8501:8501"
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./outputs:/app/outputs
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LLM_MODEL=${LLM_MODEL:-mistral:7b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - KB_PATH=/app/knowledge_base
      - OUTPUT_PATH=/app/outputs
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

# ─── Persistent Volumes (data survives restarts) ──────────────────
volumes:
  ollama_data:    # Stores downloaded LLM models
  chroma_data:    # Stores your knowledge base embeddings
